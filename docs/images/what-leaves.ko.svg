<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1200" height="380" rx="24" fill="#0B0B0C"/>

  <!-- Mac -->
  <g transform="translate(40 40)">
    <rect width="360" height="300" rx="18" fill="#18181B"/>
    <text x="28" y="48" fill="#8A8A90" font-size="15" font-weight="600">내 맥</text>
    <text x="28" y="86" fill="#FFFFFF" font-size="22" font-weight="800">원본은 여기 그대로</text>
    <text x="28" y="116" fill="#A1A1A8" font-size="15">사진은 제자리에서 읽기만 하고,</text>
    <text x="28" y="137" fill="#A1A1A8" font-size="15">복사하거나 올리지 않아요. 음식</text>
    <text x="28" y="158" fill="#A1A1A8" font-size="15">사진 고르기는 맥 안에서 해요.</text>
    <g transform="translate(28 190)">
      <rect width="70" height="70" rx="10" fill="#F4F1E8"/>
      <rect x="80" width="70" height="70" rx="10" fill="#F4F1E8" opacity="0.7"/>
      <rect x="160" width="70" height="70" rx="10" fill="#F4F1E8" opacity="0.45"/>
    </g>
  </g>

  <!-- arrows -->
  <path d="M410 120 H600" stroke="#E8FF1F" stroke-width="3"/><path d="M600 112 l12 8 l-12 8 z" fill="#E8FF1F"/>
  <text x="424" y="104" fill="#FFFFFF" font-size="15" font-weight="700">작게 줄인 음식 사진</text>

  <path d="M410 270 H600" stroke="#E8FF1F" stroke-width="3"/><path d="M600 262 l12 8 l-12 8 z" fill="#E8FF1F"/>
  <text x="424" y="254" fill="#FFFFFF" font-size="15" font-weight="700">사진 찍은 위치</text>
  <text x="424" y="296" fill="#8A8A90" font-size="13">Afterplate 프록시 또는 내 키로</text>

  <!-- AI -->
  <g transform="translate(624 60)">
    <rect width="536" height="120" rx="18" fill="#18181B"/>
    <text x="28" y="46" fill="#FFFFFF" font-size="20" font-weight="800">내가 고른 AI</text>
    <text x="28" y="76" fill="#A1A1A8" font-size="15">유료 구독의 ChatGPT나 Grok, 또는 내 키로 쓰는 Claude.</text>
    <text x="28" y="98" fill="#A1A1A8" font-size="15">방문 하나의 사진과 근처 가게 목록만 받아요. 보관함 전체는 안 가요.</text>
  </g>

  <!-- Google -->
  <g transform="translate(624 210)">
    <rect width="536" height="120" rx="18" fill="#18181B"/>
    <text x="28" y="46" fill="#FFFFFF" font-size="20" font-weight="800">Google 지도 검색</text>
    <text x="28" y="76" fill="#A1A1A8" font-size="15">약 150 m 안의 식당. 프록시는 이번 주 몫을 세려고</text>
    <text x="28" y="98" fill="#A1A1A8" font-size="15">기기 번호 하나만 남기고, 다른 건 안 남겨요.</text>
  </g>
</svg>
